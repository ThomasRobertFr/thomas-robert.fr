<section
    id="{{ page.title-short | default: page.title | slugify }}"
    class="onepage-block {% if page.class %}{{ page.class }}{% endif %}"
    {% if page.class contains "cover-image" %}style="--bg-image: url('{{ page.bg-image | prepend: site.baseurl }}')"{% endif %}>
    <div class="container onepage-block-header">
        <div class="picture">
            <img src="{{ site.author.photo | prepend: site.baseurl }}" alt="{{ site.author.name }}" width="200" height="200" />
        </div>
        <div class="text">
            {% if page.no-title != true %}
            <h1>{{ page.title }}</h1>
            {% endif %}
            <div class="content">
                {{ content }}
            </div>
        </div>
    </div>
</section>
