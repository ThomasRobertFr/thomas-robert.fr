{% comment %}
  schema.org Person describing the site owner, output on the home pages so that
  search engines / AI assistants can tie this site to the other profiles (sameAs)
{% endcomment %}
{% assign person = site.data.person %}
{% assign lang = page.lang | default: "en" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": "{{ site.url }}{{ site.baseurl }}/#person",
  "name": {{ site.author.name | jsonify }},
  "url": "{{ site.url }}{{ site.baseurl }}/",
  "image": "{{ site.author.photo | prepend: site.baseurl | prepend: site.url }}",
  "description": {{ person.description[lang] | jsonify }},
  "jobTitle": {{ person.job-title[lang] | jsonify }},
  "worksFor": {
    "@type": "Organization",
    "name": {{ person.works-for.name | jsonify }},
    "url": {{ person.works-for.url | jsonify }}
  },
  "alumniOf": [
    {% for school in person.alumni-of %}{ "@type": "CollegeOrUniversity", "name": {{ school.name | jsonify }}, "url": {{ school.url | jsonify }} }{% unless forloop.last %},
    {% endunless %}{% endfor %}
  ],
  "knowsAbout": {{ person.knows-about[lang] | jsonify }},
  "sameAs": [
    "https://www.linkedin.com/in/{{ site.author.linkedin }}",
    "https://github.com/{{ site.author.github }}",
    "https://x.com/{{ site.author.twitter }}"{% for url in person.same-as %},
    {{ url | jsonify }}{% endfor %}
  ]
}
</script>
