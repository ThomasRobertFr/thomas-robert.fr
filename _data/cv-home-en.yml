  tags: [ML, DE, web, mgmt]
  content: |
    CTO of [Heuritech](https://www.heuritech.com/), a [Luxurynsight](https://www.luxurynsight.com/) AI technology providing trend data to the fashion industry.

    - **Modernization:** defined and led a multi-year roadmap to rebuild a stack that could no longer scale.
    - **Data architecture:** Snowflake as the central data warehouse, data flows on Airflow and Celery.
    - **Cloud & AI at scale:** migration to AWS without service interruption, and new inference stack processing 10 billion images in a few weeks.
    - **Team:** restructured the tech organization around key senior hires, with almost no turnover.


