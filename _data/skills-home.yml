        en: "Central component of our data architecture, at scale (>100 tables, >100T rows): Snowpipe Streaming, UDFs, Streamlit apps"
        fr: "Composant central de notre architecture data, à l'échelle (>100 tables, >100T lignes) : Snowpipe Streaming, UDFs, applis Streamlit"
    - title: MongoDB
    - title: Airflow
    - title: Celery & Temporal
      tooltip:
        en: Scaling our major weekly crawling and ML analysis workflows (>100 high-performance parallel worker nodes)
        fr: Passage à l'échelle de nos gros workflows hebdomadaires de crawling et d'analyse ML (>100 nœuds de workers parallèles haute performance)
    - title: SQL

