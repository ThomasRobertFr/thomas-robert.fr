- title:
    en: Data engineering & architecture
    fr: Data engineering & architecture
  icon: fa-database
  no_level: true
  content:
    - title:
        en: Data platform architecture
        fr: Architecture de plateformes data
      tooltip:
        en: Picking the right technologies and making them fit together into an efficient platform that scales
        fr: Choisir les bonnes technologies et les assembler en une plateforme efficace qui passe à l'échelle
