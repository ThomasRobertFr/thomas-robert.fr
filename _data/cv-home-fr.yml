- title: Chief Technology Officer (CTO)
  at: Heuritech, une entreprise Luxurynsight – Paris, France
  date: "<span>Oct. 2023 -</span> <span>Aujourd'hui</span>"
  image: /data/cv/heuritech-ly.png
  type: pro
  icon: cogs
  tags: [ML, DE, web, mgmt]
  content: |
    CTO d'[Heuritech](https://www.heuritech.com/), une technologie IA de [Luxurynsight](https://www.luxurynsight.com/) qui fournit des données de tendances à l'industrie de la mode.

    - **Modernisation :** définition et pilotage d'une roadmap pluriannuelle pour refondre une stack qui ne passait plus à l'échelle.
    - **Architecture data :** Snowflake comme data warehouse central, flux de données sous Airflow et Celery.
    - **Cloud & IA à grande échelle :** migration vers AWS sans interruption de service, et nouvelle stack d'inférence traitant 10 milliards d'images en quelques semaines.
    - **Équipe :** restructuration de l'organisation tech autour de recrutements seniors clés, avec un turnover quasi nul.


