# Website title & description (the description is used in the HTML <head>, read by Google and co)
title: Thomas Robert
description: "Thomas Robert, CTO of Heuritech: data architecture, AI and computer vision. PhD in deep learning from Sorbonne Université."

# Your personal infos (used for the sidebar)
author:
  # Site title
  name: Thomas Robert
  description: ""
  photo: /data/images/photo.jpg
  # Contacts
  email: thomas@thomas-robert.fr
  linkedin: thomasrobertfr
  github: ThomasRobertFr
  twitter: ThomasR_Fr # X handle, used for twitter:creator

# Technical setup
baseurl: "" # url of your webpage if not at the root of the domain (leading /, no trailing /)
url: "https://www.thomas-robert.fr" # the base hostname & protocol for your site (no trailing /)
header-default-style: trianglify # default page header style (see styles in user documentation)

# X / Twitter account of the site (twitter:site in social previews)
twitter:
  username: ThomasR_Fr

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

# Detailed technical setup
sass:
  sass_dir: /assets/css/
  style: compressed
timezone: Europe/Paris
include: ['CNAME']
exclude: ['README.md']
permalink: /:title/
destination: docs/

collections:
  - onepage_home_en
  - onepage_home_fr
  - onepage_resume_en
  - onepage_resume_fr

defaults:
  # social preview (jekyll-seo-tag): photo unless a page sets its own `image`,
  # square so the small "summary" card
  - scope:
      path: ""
    values:
      image: /data/images/photo.jpg
      twitter:
        card: summary

  # posts
  - scope:
      path: _posts
    values:
      layout: post
  - scope:
      path: _posts/fr
    values:
      permalink: /blog/fr/:year/:month/:day/:title/
      lang: fr
      locale: fr_FR
  - scope:
      path: _posts/en
    values:
      permalink: /blog/en/:year/:month/:day/:title/
      lang: en
      locale: en_US

  # default layout for pages is "fr" and "en"
  - scope:
      path: en
    values:
      order: 50
      layout: page
      lang: en
      locale: en_US
  - scope:
      path: fr
    values:
      order: 50
      layout: page
      lang: fr
      locale: fr_FR
  
  # fiches scope
  - scope:
      path: fr/fiches/*
    values:
      parent: fiches.md
      no-navlink: true
      # redirect_from: /fiches/:title  # Does not work

  # default layout for blocks is "onepage-block" collections
  - scope:
      type: onepage_home_en
    values:
      layout: onepage-block
      lang: en
  - scope:
      type: onepage_home_fr
    values:
      layout: onepage-block
      lang: fr
  - scope:
      type: onepage_resume_en
    values:
      layout: onepage-block
      lang: en
  - scope:
      type: onepage_resume_fr
    values:
      layout: onepage-block
      lang: fr
